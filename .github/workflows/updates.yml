name: updates

# The anchor of the updaters (spec: Tasks, 13). Three jobs, each its own because each installs a whole root:
#   - update-tools (both runners): a signed candidate that changes the Node, Git and gh versions is applied by the real engine; paths.sh and paths.cmd name the new folders, a new pane of a real
#     Herdr resolves them, and still does after the old ones are deleted; a candidate whose pi stage fails rolls back and a pane runs the old folders again;
#   - update-card (both runners): the packaged development build with a local feed and keys made for the run; the Updates card in every state (up to date, refused with each reason, available,
#     applying, applied, rolled back, the app channel's installer or dmg), shot in zh-TW and English;
#   - update-installer (windows-2025): the real NSIS installers of 0.0.1 and 0.0.2, 0.0.1 installed silently and updated through the local feed; a 0.0.2 with one byte changed (its latest.yml
#     SHA512 regenerated) is refused by the Ed25519 check, deleted and never offered.
# The keys are generated by the tests, held in memory and in the environment of a child, and never written to a file; the repository has no release key, secret or environment for this.
# The runners are ephemeral, so the guarded fixtures are safe; SBD_REQUIRE_HOSTED_FIXTURES=1 makes a refused one fail the job.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: updates-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update-tools:
    name: update with the real tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SBD_REQUIRE_HOSTED_FIXTURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      # The pins of stack.json and the alternates of test/harness/alt-pins.ts (Node 24.22.0, Git 2.56.0.2 and 2.56.0-1, gh 2.103.2) are downloaded once and hashed again when used.
      - name: Cache the downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sbd-e2e-downloads
          key: e2e-downloads-update-${{ runner.os }}-${{ hashFiles('stack.json', 'app/test/harness/alt-pins.ts') }}
          restore-keys: |
            e2e-downloads-update-${{ runner.os }}-
            e2e-downloads-${{ runner.os }}-

      - name: Stack updates against the real tools
        working-directory: app
        env:
          SBD_E2E_LIGHT: "1"
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: |
          set -o pipefail
          node --test --test-timeout=2100000 test/e2e-light-update.test.ts 2>&1 | tee "$RUNNER_TEMP/update-tools.log"

      - name: Annotate the failing lines
        if: failure()
        run: node scripts/annotate-failures.mjs "$RUNNER_TEMP/update-tools.log" "update tools failures (${{ matrix.os }})"

  update-card:
    name: Updates card (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SBD_REQUIRE_HOSTED_FIXTURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Package the development build (electron-builder --dir)
        working-directory: app
        run: npm run pack -- --dir

      - name: Cache the downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sbd-e2e-downloads
          key: e2e-downloads-update-${{ runner.os }}-${{ hashFiles('stack.json', 'app/test/harness/alt-pins.ts') }}
          restore-keys: |
            e2e-downloads-update-${{ runner.os }}-
            e2e-downloads-${{ runner.os }}-

      - name: The Updates card against a local feed
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_KIND: dev
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=2100000 test/e2e/updates.e2e.ts 2>&1 | tee "$RUNNER_TEMP/update-card.log"

      - name: Annotate the failing lines
        if: failure()
        run: node scripts/annotate-failures.mjs "$RUNNER_TEMP/update-card.log" "Updates card failures (${{ matrix.os }})"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-screenshots-${{ matrix.os }}
          path: app/test-results/screenshots
          if-no-files-found: warn

  update-installer:
    name: install and update 0.0.1 to 0.0.2 (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      SBD_REQUIRE_HOSTED_FIXTURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      # The same sources twice, the second with version 0.0.2: both are the development product, so the installers are the ones the tests may install on a hosted runner.
      - name: Build the 0.0.1 and 0.0.2 installers
        working-directory: app
        run: |
          mkdir -p "$RUNNER_TEMP/installers"
          for v in 0.0.1 0.0.2; do
            npm run pack -- --win nsis --x64 "-c.extraMetadata.version=$v"
            cp "out/dev/straw-boss-desk-Setup-$v.exe" "$RUNNER_TEMP/installers/"
          done
          ls -l "$RUNNER_TEMP/installers"

      - name: Cache the downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sbd-e2e-downloads
          key: e2e-downloads-${{ runner.os }}-${{ hashFiles('stack.json') }}
          restore-keys: e2e-downloads-${{ runner.os }}-

      - name: Install 0.0.1 silently and update to 0.0.2 through the local feed
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
          SBD_UPDATE_INSTALLERS: ${{ runner.temp }}/installers
        run: |
          set -o pipefail
          node --test --test-concurrency=1 --test-timeout=2400000 test/e2e/updates-windows.e2e.ts 2>&1 | tee "$RUNNER_TEMP/update-installer.log"

      - name: Annotate the failing lines
        if: failure()
        run: node scripts/annotate-failures.mjs "$RUNNER_TEMP/update-installer.log" "update installer failures (windows-2025)"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updates-installer-screenshots
          path: app/test-results/screenshots
          if-no-files-found: warn
