name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Time budget (spec: CI anchor, Workflows). This job alone took 28.9 min on Windows before the task 8a e2e moved out and 39.8 min of a 40 min limit with it, so a slow runner
  # would have timed it out for no fault of the code (T8A-F016). Runner variance alone is about 11 min on Windows. Each job now has the same 40 min limit and its own work.
  ci:
    name: ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # A guarded fixture that the hosted-runner guard refuses fails the job instead of skipping (spec: Fixtures that change the machine).
      SBD_REQUIRE_HOSTED_FIXTURES: "1"
      # Both builds are packed before the tests run, so a missing one is a failure, not a skip.
      SBD_REQUIRE_PACKAGED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            profile/package-lock.json

      # stack.json against stack.schema.json, and the checker's own tests; the downloads are checked by stack-check.yml.
      - name: Stack tests
        run: |
          node --test "scripts/test/*.test.mjs"
          node scripts/check-stack.mjs --offline

      - name: Recipe tests
        working-directory: recipe
        run: npm test

      - name: Profile tests
        working-directory: profile
        run: |
          npm ci
          npm test

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: TypeScript build and type check
        working-directory: app
        run: |
          npm run build
          npm run typecheck

      - name: Package the development build (electron-builder --dir)
        working-directory: app
        run: npm run pack -- --dir

      - name: Package the release build (electron-builder --dir)
        working-directory: app
        env:
          SBD_BUILD: release
        run: npm run pack -- --dir

      # Unit tests, the UI rules (i18n parity, CSS-only animation, uniform borders, reduced motion), the hosted-runner guard and its fixture scan,
      # the packaged binaries' fuses and product names, and, on macOS, the guarded keychain smoke test.
      - name: App tests
        working-directory: app
        run: npm test

      # The task 5 anchor: the tool stages from an empty root with the real releases of stack.json (downloads, launchers, Git, a Herdr pane). The
      # downloads are cached by stack.json, so a run that does not change a pin downloads nothing; every file is hashed again when it is used.
      - name: Cache the e2e-light downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sbd-e2e-downloads
          key: e2e-downloads-${{ runner.os }}-${{ hashFiles('stack.json') }}
          restore-keys: e2e-downloads-${{ runner.os }}-

      - name: Tool stages, e2e-light
        working-directory: app
        env:
          SBD_E2E_LIGHT: "1"
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: node --test --test-timeout=900000 test/e2e-light.test.ts

      # The task 7 anchor: the profile, every pi package of stack.json, a recipe package, and claude, installed through pi from the real registry, then
      # `pi --mode rpc --no-session --offline` must list skill:pm-workflow with nothing on stderr. It uses the same download cache as the step above.
      - name: Profile and package stages, e2e-light
        working-directory: app
        env:
          SBD_E2E_LIGHT: "1"
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: node --test --test-timeout=1500000 test/e2e-light-profile.test.ts

      # The task 8a e2e files (test/e2e-runtime.test.ts and test/e2e/runtime.e2e.ts) run in the `runtime` job below, so this job stays well inside its limit
      # (T8A-F016). The development build runs the rest of the Playwright suite here.
      - name: Playwright, development build
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_KIND: dev
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: node --test --test-concurrency=1 test/e2e/app.e2e.ts

      - name: Playwright, release build
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_KIND: release
        run: npm run test:e2e

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ matrix.os }}
          path: app/test-results/screenshots
          if-no-files-found: warn

  # The task 8a anchor: a real Herdr, sb server and pi started, restarted and stopped from an installed root, and the packaged app's lifecycle against the real stack; the task 8b
  # anchor (following, crashes, power and the page) joins them.
  # Each file installs a whole root, so they are their own job (T8A-F016) and run in parallel with `ci`. They use the development build only (the release build skips the
  # lifecycle by design) and the same download cache as `ci`.
  runtime:
    name: runtime e2e (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      # A guarded fixture that the hosted-runner guard refuses fails the job instead of skipping (spec: Fixtures that change the machine).
      SBD_REQUIRE_HOSTED_FIXTURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Package the development build (electron-builder --dir)
        working-directory: app
        run: npm run pack -- --dir

      - name: Cache the e2e-light downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sbd-e2e-downloads
          key: e2e-downloads-${{ runner.os }}-${{ hashFiles('stack.json') }}
          restore-keys: e2e-downloads-${{ runner.os }}-

      # Supervisor half: the supervisor started, restarted and stopped against the real programs.
      - name: Runtime supervisor, e2e
        working-directory: app
        env:
          SBD_E2E_RUNTIME: "1"
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: node --test --test-timeout=1500000 test/e2e-runtime.test.ts

      # App half: the app killed, a second launch, --stop-stack, quit (and, on macOS, a window closed and opened again).
      - name: Playwright, lifecycle on the development build
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_KIND: dev
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: node --test --test-concurrency=1 test/e2e/runtime.e2e.ts

      # The task 8b anchor: the packaged app follows the GUI (restart, kill, /boss gui stop and Start, the failure screen at the fourth restart, suspend and resume), keeps the page
      # safe (the folder hook, navigation, preview links), and a pi in a pane of a base and its subagent resolve the app's tools, against the scripted stub model. It installs a
      # whole root like the two files above; the job stays well inside its limit (each Windows file took about 7 minutes before it).
      - name: Playwright, follow on the development build
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_KIND: dev
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: node --test --test-concurrency=1 --test-timeout=1800000 test/e2e/follow.e2e.ts
