name: wizard-from-zero

# The anchor of the wizard (spec: Workflows, task 9): the packaged
# development build, from an empty data root to the GUI, every sign-in put
# off. On macOS the root is the app's default one under the test's scratch home (not the
# runner's) and
# the Xcode tools are moved aside; on Windows it is under AppData\Local in a
# folder named "sbd 測試" under that scratch home (spec: Build notes, task 9). The runners are ephemeral, so the guarded fixtures
# are safe; SBD_REQUIRE_HOSTED_FIXTURES=1 makes a refused one fail the job.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wizard-from-zero-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  wizard:
    name: wizard-from-zero (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      SBD_REQUIRE_HOSTED_FIXTURES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Package the development build (electron-builder --dir)
        working-directory: app
        run: npm run pack -- --dir

      - name: Cache the downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sbd-e2e-downloads
          key: e2e-downloads-${{ runner.os }}-${{ hashFiles('stack.json') }}
          restore-keys: e2e-downloads-${{ runner.os }}-

      - name: The wizard from zero to the GUI
        working-directory: app
        env:
          SBD_E2E: "1"
          SBD_E2E_KIND: dev
          SBD_E2E_DOWNLOADS: ${{ runner.temp }}/sbd-e2e-downloads
        run: >-
          node --test --test-concurrency=1 --test-timeout=2100000
          test/e2e/wizard.e2e.ts

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wizard-screenshots-${{ matrix.os }}
          path: app/test-results/screenshots
          if-no-files-found: warn
