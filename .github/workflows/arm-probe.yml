name: arm-probe
on:
  push:
    branches: [scratch/arm-probe]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: x64
      - name: x64 Node
        shell: bash
        run: node scripts/arm-probe.mjs
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          architecture: arm64
      - name: arm64 Node
        shell: bash
        run: node scripts/arm-probe.mjs
