<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Straw Boss Desk</title>
	<link rel="stylesheet" href="style.css">
	<script type="module" src="welcome.js"></script>
</head>
<body>
	<main class="welcome" data-screen="welcome">
		<p class="badge dev-badge" id="dev-badge" hidden data-i18n="welcome.devBuild"></p>
		<h1 data-i18n="welcome.title"></h1>
		<p class="lead" data-i18n="welcome.lead"></p>
		<p class="note" data-i18n="welcome.next"></p>
		<p class="status"><span class="pulse" aria-hidden="true"></span><span data-i18n="welcome.status"></span></p>
		<div class="language" role="group" aria-labelledby="language-label">
			<span id="language-label" class="language-label" data-i18n="welcome.languageLabel"></span>
			<button type="button" class="language-button" data-locale="en" data-i18n="language.en"></button>
			<button type="button" class="language-button" data-locale="zh-TW" data-i18n="language.zhTW"></button>
		</div>
	</main>
</body>
</html>
