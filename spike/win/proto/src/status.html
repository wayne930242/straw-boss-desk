<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<title>Straw Boss Desk</title>
<style>
  body { font: 14px/1.5 "Segoe UI", sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  #state { margin-bottom: 12px; font-weight: 600; }
  #screen { margin: 0 0 16px; padding: 12px 16px; border: 1px solid #d4a017; background: #fff8e1; }
  #screen[hidden] { display: none; }
  #screen h2 { font-size: 16px; margin: 0 0 6px; }
  #screen pre { height: auto; max-height: 20vh; background: transparent; padding: 0; margin: 6px 0 10px; }
  button { font: inherit; padding: 4px 16px; }
  pre { background: #f4f4f4; padding: 10px; height: 60vh; overflow: auto; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Straw Boss Desk (spike)</h1>
<div id="state">Starting...</div>
<div id="screen" hidden>
  <h2 id="screen-title"></h2>
  <pre id="screen-text"></pre>
  <button id="start" type="button">Start</button>
</div>
<pre id="log"></pre>
<script src="status.js"></script>
</body>
</html>
